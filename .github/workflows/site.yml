name: Site

# Typechecks and builds the closetalk.dev site, so a broken page or a vulnerable Next.js fails here
# instead of on Vercel. next build refuses versions with known security advisories.
on:
  pull_request:
    paths: [site/**, .github/workflows/site.yml]
  push:
    branches: [main]
    paths: [site/**, .github/workflows/site.yml]

permissions:
  contents: read

jobs:
  site-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
